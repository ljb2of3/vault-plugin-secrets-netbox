name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly run so newly published vulnerability advisories surface on their
  # own, instead of waiting for the next push to main. Offset from the hour
  # because on-the-hour schedules queue behind GitHub's peak load.
  schedule:
    - cron: "17 5 * * *"

# Least-privilege default; individual jobs add scopes if they need them.
permissions:
  contents: read

jobs:
  test:
    name: test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # golangci-lint bundles govet, so a separate vet job isn't needed.
      # Action v7+ is required for golangci-lint v2 configs.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      # Deliberately not golang/govulncheck-action: it sets up Go 'stable'
      # regardless of go.mod, so it scanned a different toolchain than the one
      # release.yml ships. Setting Go up ourselves keeps the scan honest about
      # what we actually build.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # Building govulncheck itself may want a newer toolchain than we pin, so
      # let this step resolve one; only the scan below has to stay pinned.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # GOTOOLCHAIN=local forces the analysis onto the exact toolchain from
      # go.mod. Without it, an auto-upgrade would scan a patched stdlib and
      # report clean while releases still build on the vulnerable one.
      - name: scan with the pinned toolchain
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          govulncheck ./...

  license:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-copywrite@32638da2d4e81d56a0764aa1547882fc4d209636 # v1.1.3
      - name: check headers
        run: copywrite headers --plan
